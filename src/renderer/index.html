<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob: data:; img-src 'self' file: data: blob:;"
    />
    <title>AdNabbit Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chrome">
      <div class="brand">
        <span class="logo">AdNabbit</span>
        <span id="screen-label" class="muted">Pairing…</span>
      </div>
      <div class="chrome-right">
        <button id="clear-pairing" class="ghost" type="button" hidden title="Clear pairing and re-run setup">
          Clear pairing
        </button>
        <div id="status" class="muted">Starting</div>
      </div>
    </div>
    <div id="stage">
      <div id="idle">
        <p class="idle-title">Waiting for playlist</p>
        <p id="idle-detail" class="muted">Claim a device, then keep this window open.</p>
      </div>
      <video id="video" playsinline></video>
      <img id="image" alt="" />
    </div>
    <script src="player.js"></script>
  </body>
</html>
