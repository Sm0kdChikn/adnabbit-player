<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';"
    />
    <title>AdNabbit</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0f14;
        color: #e8eef5;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 1rem;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      img {
        width: 160px;
        height: auto;
        border-radius: 12px;
      }
      .brand {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .sub {
        font-size: 0.85rem;
        color: #8b9bb0;
      }
      .pulse {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, #3b82f6, #22d3ee, #3b82f6);
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="logo.jpg" alt="AdNabbit" />
      <div class="brand">AdNabbit</div>
      <div class="sub">Starting player…</div>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
